name: Replace HQ images

on:
  push:
    paths:
      - '.image-import/READY'

permissions:
  contents: write

jobs:
  replace-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode image bundle
        run: |
          cat .image-import/parts/*.b64 | base64 --decode > /tmp/gsa-hq-images.zip
          unzip -o /tmp/gsa-hq-images.zip -d public/projects
          rm -f \
            public/projects/fea-gripper.webp \
            public/projects/galpao-mineracao.webp \
            public/projects/hero-industria.webp \
            public/projects/modelagem-bim.webp \
            public/projects/plataforma.webp \
            public/projects/ponte-ferroviaria.webp \
            public/projects/robotica.webp
          rm -rf .image-import
          rm -f .github/workflows/replace-hq-images.yml
      - name: Commit high quality assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restaura imagens GSA em alta qualidade" || exit 0
          git push
