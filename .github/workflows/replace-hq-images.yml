name: Replace HQ images

on:
  workflow_dispatch:
  push:
    paths:
      - '.image-import/**'

permissions:
  contents: write

jobs:
  replace-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode image bundle
        run: |
          cat .image-import/parts/*.b64 | base64 --decode > /tmp/gsa-hq-images.zip
          unzip -o /tmp/gsa-hq-images.zip -d public/projects
          rm -rf .image-import
      - name: Commit high quality assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/projects .image-import
          git commit -m "fix: restaura imagens GSA em alta qualidade" || exit 0
          git push
